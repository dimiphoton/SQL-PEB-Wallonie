[project]
name = "sql-peb-wallonie"
version = "0.1.0"
description = "Analyse SQL des certificats PEB wallons (DuckDB)."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "certifi",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Pas de package importable : l'analyse vit dans sql/ et scripts/.
[tool.setuptools]
packages = []
